name: Build congress dashboard JSON

on:
  schedule:
    - cron: "0 6 2 * *"      # 06:00 UTC on the 2nd of every month
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/congress_dashboard.json
        run: python scripts/build_dashboard_json.py
        env:
          SECTIONS_OPEN: "true"        # "false" renders card sections collapsed
          PHOTO_URL_TEMPLATE: "https://theunitedstates.io/images/congress/225x275/{id}.jpg"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/congress_dashboard.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly data refresh"
            git push
          fi
